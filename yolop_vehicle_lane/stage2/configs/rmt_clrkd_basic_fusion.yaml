run:
  name: stage2_rmt_clrkd_basic_fusion
  drive_root: /content/drive/MyDrive/EcoCAR
  output_tar: /content/drive/MyDrive/EcoCAR/training_runs/stage2_rmt_clrkd_basic_fusion.tar
dataset:
  bdd_archive: /content/drive/MyDrive/EcoCAR/datasets/bdd100k_clrkd_curve.tar
  local_dir: /content/bdd100k_clrkd_curve
  splits:
  - train
  - val
  max_lanes: 10
  num_points: 72
  image_size:
  - 384
  - 640
  org_image_size:
  - 720
  - 1280
  aux_mask_size:
  - 72
  - 128
  vehicle_classes:
  - vehicle
model:
  backbone: csp_yolop_lite
  feature_channels:
  - 128
  - 256
  - 512
  detection_head:
    type: rt_detr
    num_queries: 300
    num_classes: 1
    embed_dim: 256
  lane_head:
    embed_dim: 128
    max_lanes: 10
    num_points: 72
    mask_size:
    - 72
    - 128
    mask_aux: true
    num_lane_classes: 7
loss:
  use_uncertainty: false
  lambda_lane: 0.3
  det:
    cls_loss_weight: 1.0
    bbox_loss_weight: 5.0
    giou_loss_weight: 2.0
  lane:
    w_cls: 2.0
    w_reg: 0.5
    w_iou: 2.0
    w_mask: 1.0
    w_smooth: 0.05
    w_distill: 0.0
    focal_alpha: 0.25
    focal_gamma: 2.0
    line_iou_radius: 0.015
train:
  optimizer: adamw
  lr0: 0.0002
  weight_decay: 0.0005
  warmup_epochs: 3
  end_epoch: 10
  batch_size: 8
  workers: 2
  grad_clip_norm: 5.0
  val_every: 1
  save_every: 5
eval:
  conf_threshold: 0.4
  curve_match_radius: 0.015
  log_grad_cosine: true
