# Stage 2 — Experiment 6 — YOLO26 backbone + CLRKD curve lane head.
# Experimental, off the stable Stage 2 baseline. Uses the YOLO26 pipeline
# (top-level yolo26_pipeline) for backbone+neck construction. Detection
# head is left at YOLO26's native head for this experiment so the only
# new piece is the lane branch.

run:
  name: stage2_yolo26_clrkd_experiment
  drive_root: /content/drive/MyDrive/EcoCAR
  output_tar: /content/drive/MyDrive/EcoCAR/training_runs/stage2_yolo26_clrkd_experiment.tar

dataset:
  bdd_archive: /content/drive/MyDrive/EcoCAR/datasets/bdd100k_clrkd_curve.tar
  local_dir: /content/bdd100k_clrkd_curve
  max_lanes: 10
  num_points: 72
  image_size: [384, 640]
  org_image_size: [720, 1280]
  aux_mask_size: [72, 128]

model:
  backbone: yolo26
  yolo26:
    weights: yolo26s.pt
    keep_native_detection_head: true
  feature_channels: [256, 512, 512]   # rough P3/P4/P5 default; auto-probed at runtime
  lane_head:
    embed_dim: 128
    max_lanes: 10
    num_points: 72
    mask_size: [72, 128]
    mask_aux: true
    num_lane_classes: 7

loss:
  use_uncertainty: false
  lambda_lane: 1.0
  lane:
    w_cls: 2.0
    w_reg: 0.5
    w_iou: 2.0
    w_mask: 1.0
    w_smooth: 0.05
    focal_alpha: 0.25
    focal_gamma: 2.0
    line_iou_radius: 0.015

train:
  optimizer: adamw
  lr0: 1.5e-4
  weight_decay: 5.0e-4
  warmup_epochs: 3
  end_epoch: 20
  batch_size: 16
  workers: 4
  grad_clip_norm: 5.0
  val_every: 1
  save_every: 5

eval:
  conf_threshold: 0.4
  curve_match_radius: 0.015
