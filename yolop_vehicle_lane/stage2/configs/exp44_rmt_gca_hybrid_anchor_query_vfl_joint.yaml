run:
  name: exp44_rmt_gca_hybrid_anchor_query_vfl_joint
  seed: 0
  work_dir: /content/exp44_rmt_gca_hybrid_anchor_query_vfl_joint
  output_tar: /content/drive/MyDrive/EcoCAR/training_runs/exp44_rmt_gca_hybrid_anchor_query_vfl_joint.tar
dataset:
  bdd_archive: /content/drive/MyDrive/EcoCAR/datasets/bdd100k_clrkd_curve.tar
  local_dir: /content/bdd100k_clrkd_curve
  max_lanes: 10
  num_points: 72
  image_size:
  - 384
  - 640
  org_image_size:
  - 720
  - 1280
  aux_mask_size:
  - 72
  - 128
  vehicle_classes:
  - vehicle
model:
  backbone: exp2b_rmt_gca
  width: 0.5
  use_aifi: true
  yolo26:
    source_root: null
    model_path: null
    feature_indices: null
    strict: true
  detection_head:
    type: detr
    num_queries: 100
    num_classes: 1
    embed_dim: 256
    num_decoder_layers: 3
    num_heads: 8
    dim_feedforward: 1024
  lane_head:
    # Exp2TT: HybridPriorQueryHead. NB47 (K=64 query head) was the first
    # experiment to break the cls collapse (pos-neg gap 0.099 vs 0.01 in
    # all anchor-head experiments) but its geometry was weak (matched_iou
    # 0.27 vs anchor's 0.54 in NB48). The hybrid head combines:
    # - Stage 1: 192 anchor priors with dynamic-k matching (the geometry
    #   champion, supervised via stage1_aux_loss_weight)
    # - Stage 2: K=12 queries that attend to stage 1's per-prior features
    #   AND the spatial map, with Hungarian 1-to-1 + VFL (the cls champion)
    # Inference uses stage 2's cls + the curves they reference. We get
    # NB48's geometry AND NB47's cls in one model.
    type: hybrid
    embed_dim: 128
    max_lanes: 10
    num_points: 72
    num_priors: 192
    sample_points: 36
    roi_refine_layers: 3
    roi_mid_channels: 48
    cross_attn_resize:
    - 10
    - 25
    num_queries: 12
    refiner_layers: 2
    refiner_heads: 8
    refiner_ff_dim: 512
    refiner_dropout: 0.1
    refiner_attn_to_spatial: true
    mask_size:
    - 72
    - 128
    mask_aux: true
    num_lane_classes: 7
loss:
  det:
    bbox_loss_weight: 5.0
    cls_loss_weight: 1.0
    dn_loss_weight: 0.0
    giou_loss_weight: 2.0
    obj_loss_weight: 1.0
  lambda_gate_reg: 0.001
  lambda_det: 1.0
  lambda_lane: 1.0
  lambda_max: 2.0
  lambda_min: 0.5
  lambda_mode: fixed
  lane:
    # Stage 2 is supervised by Hungarian 1-to-1 + VFL (the NB47 recipe).
    cls_target_type: matched_existence
    cls_loss_type: vfl
    vfl_alpha: 0.75
    vfl_gamma: 2.0
    cls_ohem_topk_per_pos: 0
    cls_balance_mode: mean
    line_iou_radius: 0.015
    w_cls: 5.0
    w_distill: 0.0
    w_iou: 2.0
    w_mask: 1.0
    w_reg: 1.2
    w_smooth: 0.05
    w_xytl: 0.2
    use_lane_matching: true
    match_cost_cls: 1.0
    match_cost_point: 5.0
    match_cost_iou: 2.0
    match_cost_xytl: 0.2
    # Hungarian 1-to-1 on stage 2 (K=12 queries vs ~5 GT lanes).
    lane_assigner: hungarian
    dynamic_k_topk: 4
    aux_stage_loss_weight: 0.0
    # Stage 1 (192 anchors) gets full supervision via this weight. With
    # dynamic_k matching applied internally to stage 1 by the loss path
    # via the existing CLRKDLaneHead aux mechanism, we keep NB45/48-style
    # geometry training on the priors.
    stage1_aux_loss_weight: 1.0
    asl_gamma_pos: 0.0
    asl_gamma_neg: 4.0
    asl_clip: 0.05
    focal_alpha: 0.25
    focal_gamma: 2.0
    qfl_gamma: 2.0
    lineiou_target_pow: 1.0
  no_object_weight: 0.25
  use_uncertainty: true
  geometry_warmup_epochs: 1
train:
  lr0: 0.0002
  backbone_lr_mult: 0.1
  head_lr_mult: 2.0
  weight_decay: 0.0005
  end_epoch: 20
  batch_size: 8
  workers: 2
  grad_clip_norm: 5.0
  val_every: 1
  save_every: 5
  print_every: 50
  amp:
    kind: bfloat16
  lr_scheduler:
    kind: cosine
    warmup_epochs: 2
    warmup_start_lr_factor: 0.1
    min_lr_factor: 0.05
  phases:
  - name: head_warmup
    until_epoch: 2
  - name: full_finetune
    until_epoch: 999
eval:
  val_batches: 40
  log_grad_cosine: true
  grad_cos_probe_interval: 50
  lane_exist_threshold: 0.3
  decoded_top_k: 6
  decoded_lane_iou_threshold: 0.5
  decoded_lane_nms_iou: 0.5
  decoded_score_threshold: 0.0
  decoded_score_source: cls
  decoded_oracle_enabled: true
teacher:
  lane_head_checkpoint: null
